<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — TCG Greedo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08040d;
      --surface: #12091c;
      --surface2: #1a0f28;
      --border: #2a1a3d;
      --text: #f5f0ff;
      --subtle: #7a6b8f;
      --muted: #4a3d5f;
      --purple: #8b3fbf;
      --purple-neon: #c77dff;
      --purple-dim: rgba(139, 63, 191, 0.15);
      --red: #ff4a6b;
      --green: #4aff8b;
      --gold: #ffd76b;
      --display: 'Russo One', 'Impact', sans-serif;
      --sans: 'Inter', -apple-system, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, select, textarea { font-family: inherit; }

    /* ── PASSWORD GATE ─────────────────────────────────────────── */
    .gate {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .gate-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .gate-logo {
      font-family: var(--display);
      font-size: 28px;
      font-style: italic;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 0%, #c77dff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .gate-sub {
      font-size: 12px;
      color: var(--subtle);
      letter-spacing: 1px;
      margin-bottom: 28px;
    }
    .gate-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .gate-input:focus { outline: none; border-color: var(--purple-neon); }
    .gate-input::placeholder { letter-spacing: 0; color: var(--muted); }
    .gate-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-neon) 100%);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 6px;
    }
    .gate-error {
      color: var(--red);
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    /* ── HEADER ─────────────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-logo {
      font-family: var(--display);
      font-size: 18px;
      font-style: italic;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #fff 0%, #c77dff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-badge {
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--purple-neon);
      background: var(--purple-dim);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .header-right { display: flex; gap: 10px; align-items: center; }
    .header-link {
      font-size: 11px;
      color: var(--subtle);
      letter-spacing: 0.5px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .header-link:hover { border-color: var(--purple-neon); color: var(--text); }

    /* ── TABS ───────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      background: var(--surface);
    }
    .tab {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--subtle);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active { color: var(--purple-neon); border-bottom-color: var(--purple-neon); }
    .tab:hover { color: var(--text); }
    .tab-count {
      font-size: 10px;
      background: var(--purple-dim);
      color: var(--purple-neon);
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }

    /* ── TOOLBAR ─────────────────────────────────────────────────── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-search {
      flex: 1;
      min-width: 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
    }
    .toolbar-search:focus { outline: none; border-color: var(--purple-neon); }
    .toolbar-search::placeholder { color: var(--muted); }
    .btn-add {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-neon) 100%);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(139, 63, 191, 0.3);
      transition: transform 0.2s;
    }
    .btn-add:hover { transform: translateY(-1px); }

    /* ── INVENTORY GRID ─────────────────────────────────────────── */
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 0 20px 20px;
    }
    .admin-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .admin-card:hover { border-color: var(--purple-neon); }
    .admin-card-img {
      aspect-ratio: 3/4;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .admin-card-img img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .admin-card-status {
      position: absolute;
      top: 6px; left: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 7px;
      border-radius: 3px;
    }
    .status-active { background: rgba(74, 255, 139, 0.15); color: var(--green); }
    .status-sold { background: rgba(255, 74, 107, 0.15); color: var(--red); }
    .status-archived { background: rgba(255, 215, 107, 0.15); color: var(--gold); }
    .admin-card-grade {
      position: absolute;
      top: 6px; right: 6px;
      font-size: 9px;
      font-weight: 700;
      background: rgba(0,0,0,0.8);
      color: var(--purple-neon);
      padding: 3px 7px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }
    .admin-card-info {
      padding: 10px;
    }
    .admin-card-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .admin-card-meta {
      font-size: 10px;
      color: var(--subtle);
    }
    .admin-card-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--purple-neon);
      margin-top: 4px;
    }
    .admin-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--subtle);
    }

    /* ── SLIDE-UP PANEL (add/edit slab) ──────────────────────────── */
    .panel-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .panel-overlay.open { opacity: 1; pointer-events: auto; }
    .panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-height: 92vh;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      z-index: 101;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .panel.open { transform: translateY(0); }
    .panel-handle {
      width: 40px; height: 4px;
      background: var(--muted);
      border-radius: 2px;
      margin: 12px auto 0;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 5;
    }
    .panel-title {
      font-family: var(--display);
      font-size: 16px;
      letter-spacing: 1px;
    }
    .panel-close {
      font-size: 20px;
      color: var(--subtle);
      padding: 4px 8px;
      cursor: pointer;
    }
    .panel-body { padding: 0 20px 24px; }

    /* ── UPLOAD ZONE ─────────────────────────────────────────────── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--purple-neon);
      background: var(--purple-dim);
    }
    .upload-zone-icon { font-size: 32px; margin-bottom: 8px; }
    .upload-zone-text { font-size: 13px; color: var(--text); margin-bottom: 4px; }
    .upload-zone-hint { font-size: 11px; color: var(--muted); }
    .upload-preview {
      display: none;
      margin-bottom: 20px;
    }
    .upload-preview.show { display: block; }
    .upload-preview img {
      max-height: 200px;
      border-radius: 8px;
      margin: 0 auto;
      display: block;
      border: 1px solid var(--border);
    }
    .parsing-indicator {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--purple-neon);
      font-size: 13px;
    }
    .parsing-indicator.show { display: block; }
    .parsing-spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--purple-neon);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FORM FIELDS ─────────────────────────────────────────────── */
    .field { margin-bottom: 14px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--subtle);
      margin-bottom: 5px;
    }
    .field-input, .field-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .field-input:focus, .field-select:focus {
      outline: none;
      border-color: var(--purple-neon);
    }
    .field-input::placeholder { color: var(--muted); }
    .field-input.auto-filled {
      border-color: var(--purple);
      background: rgba(139, 63, 191, 0.08);
    }

    /* ── ACTION BUTTONS ──────────────────────────────────────────── */
    .panel-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 100px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-neon) 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(139, 63, 191, 0.3);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-danger {
      background: transparent;
      border: 1px solid rgba(255, 74, 107, 0.3);
      color: var(--red);
    }
    .btn-archive {
      background: transparent;
      border: 1px solid rgba(255, 215, 107, 0.3);
      color: var(--gold);
    }

    /* ── DETAIL VIEW (edit mode) ──────────────────────────────────── */
    .detail-img-wrap {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      max-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-img-wrap img {
      max-height: 220px;
      width: auto;
    }

    /* ── STATS BAR ────────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 16px 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-num {
      font-family: var(--display);
      font-size: 22px;
      color: var(--text);
    }
    .stat-label {
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--subtle);
      margin-top: 2px;
    }

    /* ── TOAST ─────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 200;
      transition: transform 0.3s;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ───────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .admin-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px 12px; }
      .toolbar { padding: 12px; }
      .tabs { padding: 0 12px; }
      .panel { max-height: 95vh; }
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       PASSWORD GATE
       ═══════════════════════════════════════════════════════════ -->
  <div id="gate" class="gate">
    <div class="gate-box">
      <div class="gate-logo">TCGGREEDO</div>
      <div class="gate-sub">Inventory Admin</div>
      <input type="password" id="gatePass" class="gate-input" placeholder="Enter password" onkeydown="if(event.key==='Enter') checkPass()">
      <button class="gate-btn" onclick="checkPass()">ENTER</button>
      <div class="gate-error" id="gateError">Wrong password</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       ADMIN DASHBOARD (hidden until auth)
       ═══════════════════════════════════════════════════════════ -->
  <div id="dashboard" style="display:none;">

    <!-- Header -->
    <div class="header">
      <div>
        <span class="header-logo">TCGGREEDO</span>
        <span class="header-badge">ADMIN</span>
      </div>
      <div class="header-right">
        <a href="index.html" class="header-link">View Site</a>
        <button class="header-link" onclick="logout()">Log Out</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="active" onclick="switchTab('active')">Active <span class="tab-count" id="countActive">0</span></div>
      <div class="tab" data-tab="sold" onclick="switchTab('sold')">Sold <span class="tab-count" id="countSold">0</span></div>
      <div class="tab" data-tab="archived" onclick="switchTab('archived')">Archived <span class="tab-count" id="countArchived">0</span></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input type="text" class="toolbar-search" id="searchInput" placeholder="Search slabs..." oninput="renderGrid()">
      <button class="btn-add" onclick="openAddPanel()">+ Add Slab</button>
    </div>

    <!-- Inventory Grid -->
    <div class="admin-grid" id="adminGrid"></div>

  </div>

  <!-- ═══════════════════════════════════════════════════════════
       ADD/EDIT PANEL (slides up from bottom)
       ═══════════════════════════════════════════════════════════ -->
  <div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <span class="panel-title" id="panelTitle">Add Slab</span>
      <span class="panel-close" onclick="closePanel()">×</span>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
  /* ═══════════════════════════════════════════════════════════════
     TCG GREEDO — ADMIN LOGIC
     ═══════════════════════════════════════════════════════════════ */

  // ── CONFIG ─────────────────────────────────────────────────────
  const API_URL = '/.netlify/functions/api';
  let adminPassword = '';  // Set on login, sent with every API call

  // ── STATE ─────────────────────────────────────────────────────
  let inventory = [];
  let inventorySha = null;  // GitHub file sha for updates
  let currentTab = 'active';
  let editingId = null;

  // ── API HELPER ────────────────────────────────────────────────
  async function api(action, payload = {}) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, password: adminPassword, ...payload })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'API error');
    return data;
  }

  // ── HELPERS ───────────────────────────────────────────────────
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  function getAvailable(s) {
    const qty = s.quantity || 1;
    if (s.sold === true) return 0;
    if (s.sold === false || s.sold === undefined) return qty;
    return Math.max(0, qty - (s.sold || 0));
  }
  function isSoldOut(s) { return getAvailable(s) === 0; }

  function getStatus(s) {
    if (s.archived) return 'archived';
    if (isSoldOut(s)) return 'sold';
    return 'active';
  }

  function formatPrice(n) {
    if (!n || n === 0) return 'Offer';
    return '$' + Number(n).toLocaleString('en-US');
  }

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── AUTH ──────────────────────────────────────────────────────
  async function checkPass() {
    const pass = $('#gatePass').value;
    adminPassword = pass;
    try {
      // Test the password by making an API call
      const data = await api('get-inventory');
      inventory = data.inventory || [];
      inventorySha = data.sha;
      sessionStorage.setItem('tcg_admin', pass);
      showDashboard();
    } catch (e) {
      adminPassword = '';
      $('#gateError').style.display = 'block';
      $('#gatePass').value = '';
      setTimeout(() => $('#gateError').style.display = 'none', 2000);
    }
  }

  function logout() {
    sessionStorage.removeItem('tcg_admin');
    adminPassword = '';
    $('#dashboard').style.display = 'none';
    $('#gate').style.display = 'flex';
    $('#gatePass').value = '';
  }

  async function showDashboard() {
    $('#gate').style.display = 'none';
    $('#dashboard').style.display = 'block';
    await loadInventory();
  }

  // ── LOAD INVENTORY ────────────────────────────────────────────
  async function loadInventory() {
    try {
      const data = await api('get-inventory');
      inventory = data.inventory || [];
      inventorySha = data.sha;
    } catch (e) {
      toast('Failed to load inventory: ' + e.message);
    }
    updateCounts();
    renderGrid();
  }

  // ── STATS + COUNTS ────────────────────────────────────────────
  function updateCounts() {
    const active = inventory.filter(s => !s.archived && !isSoldOut(s));
    const sold = inventory.filter(s => !s.archived && isSoldOut(s));
    const archived = inventory.filter(s => s.archived);
    const totalQty = inventory.reduce((sum, s) => sum + (s.quantity || 1), 0);

    $('#countActive').textContent = active.length;
    $('#countSold').textContent = sold.length;
    $('#countArchived').textContent = archived.length;

    $('#stats').innerHTML = `
      <div class="stat-card"><div class="stat-num">${totalQty}</div><div class="stat-label">Total Slabs</div></div>
      <div class="stat-card"><div class="stat-num">${active.length}</div><div class="stat-label">Listed</div></div>
      <div class="stat-card"><div class="stat-num">${sold.length}</div><div class="stat-label">Sold</div></div>
      <div class="stat-card"><div class="stat-num">${archived.length}</div><div class="stat-label">Archived</div></div>
    `;
  }

  // ── TABS ──────────────────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    renderGrid();
  }

  // ── RENDER GRID ───────────────────────────────────────────────
  function renderGrid() {
    const grid = $('#adminGrid');
    const search = $('#searchInput').value.toLowerCase();

    let items = inventory.filter(s => {
      const status = getStatus(s);
      if (status !== currentTab) return false;
      if (search && !s.name.toLowerCase().includes(search) && !s.set.toLowerCase().includes(search) && !s.id.includes(search)) return false;
      return true;
    });

    if (items.length === 0) {
      grid.innerHTML = `<div class="admin-empty">No ${currentTab} slabs${search ? ' matching "' + search + '"' : ''}</div>`;
      return;
    }

    grid.innerHTML = items.map(s => {

      const statusLabel = status === 'active' ? 'ACTIVE' : status === 'sold' ? 'SOLD' : 'ARCHIVED';
      const statusClass = 'status-' + status;

  }

  // ── UPLOAD + PARSE ────────────────────────────────────────────
  let uploadedImageData = null;

  function handleUpload(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedImageData = e.target.result;
      $('#uploadPreview').classList.add('show');
      $('#previewImg').src = uploadedImageData;
      $('#uploadZone').style.display = 'none';
      parseSlab(uploadedImageData);
    };
    reader.readAsDataURL(file);
  }

  function skipUpload() {
    $('#uploadZone').style.display = 'none';
    $('#slabFields').style.display = 'block';
  }

  async function parseSlab(imageData) {
    $('#parsing').classList.add('show');

    try {
      // Strip data URL prefix to get pure base64
      const base64 = imageData.split(',')[1];
      const mimeType = imageData.match(/data:(.*?);/)?.[1] || 'image/jpeg';

      // Call Claude API via serverless function
      const data = await api('parse-slab', { imageBase64: base64, mimeType });
      const parsed = data.parsed;

      $('#parsing').classList.remove('show');
      $('#slabFields').style.display = 'block';

      // Fill fields
      if (parsed.name) { $('#fName').value = parsed.name; $('#fName').classList.add('auto-filled'); }
      if (parsed.set) { $('#fSet').value = parsed.set; $('#fSet').classList.add('auto-filled'); }
      if (parsed.year) { $('#fYear').value = parsed.year; $('#fYear').classList.add('auto-filled'); }
      if (parsed.cardNumber) { $('#fCardNum').value = parsed.cardNumber; $('#fCardNum').classList.add('auto-filled'); }
      if (parsed.grader) { $('#fGrader').value = parsed.grader; }
      if (parsed.grade) { $('#fGrade').value = parsed.grade; $('#fGrade').classList.add('auto-filled'); }
      if (parsed.cert) { $('#fCert').value = parsed.cert; $('#fCert').classList.add('auto-filled'); }

      toast('Label parsed successfully');

      // Store crop data for fallback
      window._slabCrop = parsed.crop || null;

      // Fetch card art and composite slab image
      if (parsed.name) {
        fetchAndPreviewPsaScan(parsed.cert || '');
      }
    } catch (e) {
      $('#parsing').classList.remove('show');
      $('#slabFields').style.display = 'block';
      toast('Parse failed — enter details manually');
      console.error(e);
    }
  }

  // Fetch card art from PokemonTCG API (browser-side, matching Cardex pattern)
  async function fetchAndPreviewPsaScan(cert) {
    toast('Fetching card image...');
    try {
      const cardInfo = {
        name: $('#fName').value,
        set: $('#fSet').value,
        cardNumber: $('#fCardNum').value,
        grader: $('#fGrader').value,
        grade: $('#fGrade').value,
        year: $('#fYear').value,
        cert: cert
      };

      // Extract core Pokemon name (strip suffixes like "— Holo", "LV.X", "ex")
      const coreName = cardInfo.name
        .replace(/\s*—.*/,'')
        .replace(/\s*LV\.?\s*X$/i,'')
        .replace(/\s+ex$/i,'')
        .replace(/\s+EX$/,'')
        .replace(/\s+GX$/i,'')
        .replace(/\s+V$/i,'')
        .replace(/\s+VMAX$/i,'')
        .replace(/\s+VSTAR$/i,'')
        .trim();

      // Build query matching Cardex pattern (wildcards + select for speed)
      let query = `name:"${coreName}*"`;
      if (cardInfo.set) {
        const safeSet = cardInfo.set.replace(/"/g, '');
        query += ` set.name:"${safeSet}*"`;
      }
      const encoded = encodeURIComponent(query);
      const url = `https://api.pokemontcg.io/v2/cards?q=${encoded}&pageSize=10&select=id,name,images`;

      let res = await fetch(url);
      let data = res.ok ? await res.json() : null;

      // Fallback: name only (set name mismatch)
      if (!data || !data.data || data.data.length === 0) {
        const nameOnly = encodeURIComponent(`name:"${coreName}*"`);
        res = await fetch(`https://api.pokemontcg.io/v2/cards?q=${nameOnly}&pageSize=5&select=id,name,images`);
        data = res.ok ? await res.json() : null;
      }

      if (!data || !data.data || data.data.length === 0) {
        cropAndUsePhoto();
        return;
      }

      // Best match: prefer name containing our core name
      let best = data.data.find(c => c.name.toLowerCase().includes(coreName.toLowerCase())) || data.data[0];

      // If multiple results, try matching by card number
      if (cardInfo.cardNumber && data.data.length > 1) {
        const num = cardInfo.cardNumber.split('/')[0];
        const numMatch = data.data.find(c => c.id && c.id.endsWith('-' + num));
        if (numMatch) best = numMatch;
      }

      const imageUrl = best.images?.large || best.images?.small;
      if (!imageUrl) {
        cropAndUsePhoto();
        return;
      }

      // Load image via img tag then convert to data URL using canvas
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = async () => {
        // Draw to canvas to get data URL (avoids CORS blob issues)
        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);

        let imgDataUrl;
        try {
          imgDataUrl = c.toDataURL('image/png');
        } catch(e) {
          // CORS tainted — try fetching as blob through our API
          try {
            const dlData = await api('fetch-psa-scan', { imageUrl: imageUrl });
            if (dlData.imageBase64) {
              imgDataUrl = 'data:image/png;base64,' + dlData.imageBase64;
            } else {
              toast('Image CORS blocked — using your photo');
              return;
            }
          } catch(e2) {
            toast('Image download failed — using your photo');
            return;
          }
        }

        // Composite with PSA label
        const composited = await compositeSlabImage(imgDataUrl, cardInfo);
        $('#previewImg').src = composited;
        uploadedImageData = composited;
        toast('Card image loaded with ' + cardInfo.grader + ' label');
      };
      img.onerror = () => {
        cropAndUsePhoto();
        return;
      };
      img.src = imageUrl;

    } catch (e) {
      cropAndUsePhoto();
      console.log('Card image fetch error:', e);
    }
  }

  // Crop uploaded photo to just the slab using Claude's coordinates
  function cropAndUsePhoto() {
    if (!uploadedImageData || !window._slabCrop) {
      toast('Using your full photo');
      return;
    }

    const crop = window._slabCrop;
    const img = new Image();
    img.onload = () => {
      const sx = (crop.left / 100) * img.width;
      const sy = (crop.top / 100) * img.height;
      const sw = (crop.width / 100) * img.width;
      const sh = (crop.height / 100) * img.height;

      // Add some padding (2%)
      const pad = 0.02;
      const fx = Math.max(0, sx - img.width * pad);
      const fy = Math.max(0, sy - img.height * pad);
      const fw = Math.min(img.width - fx, sw + img.width * pad * 2);
      const fh = Math.min(img.height - fy, sh + img.height * pad * 2);

      const canvas = document.createElement('canvas');
      // Max 800px wide for file size
      const maxW = 800;
      const scale = fw > maxW ? maxW / fw : 1;
      canvas.width = Math.round(fw * scale);
      canvas.height = Math.round(fh * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, fx, fy, fw, fh, 0, 0, canvas.width, canvas.height);

      const cropped = canvas.toDataURL('image/jpeg', 0.85);
      $('#previewImg').src = cropped;
      uploadedImageData = cropped;
      toast('Photo cropped to slab');
    };
    img.onerror = () => toast('Using your full photo');
    img.src = uploadedImageData;
  }    
  // Compress any image data URL to JPEG at maxWidth, return pure base64 (no prefix)
  function compressImage(dataUrl, maxWidth, quality) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const scale = img.width > maxWidth ? maxWidth / img.width : 1;
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.onerror = () => resolve(dataUrl.split(',')[1]);
      img.src = dataUrl;
    });
  }    
  // Composite card art + PSA/CGC label using Canvas
  function compositeSlabImage(cardDataUrl, info) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        // Canvas dimensions — slab proportions (3:4 with label space)
        const labelH = 90;
        const padding = 16;
        const caseW = img.width + padding * 2;
        const caseH = img.height + labelH + padding * 3;

        const canvas = document.createElement('canvas');
        canvas.width = caseW;
        canvas.height = caseH;
        const ctx = canvas.getContext('2d');

        // Slab background (dark gray case)
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(0, 0, caseW, caseH);

        // Inner border
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 4, caseW - 8, caseH - 8);

        // ── PSA LABEL ──────────────────────────────
        const lx = padding;
        const ly = padding;
        const lw = caseW - padding * 2;

        // Red label background
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(lx, ly, lw, labelH);

        // White inner area
        ctx.fillStyle = '#fff';
        ctx.fillRect(lx + 3, ly + 3, lw - 6, labelH - 6);

        // Red top bar with year + set
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(lx + 3, ly + 3, lw - 6, 26);

        // Year + Set text (white on red)
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px Arial, sans-serif';
        const yearSet = (info.year ? info.year + ' ' : '') + 'POKEMON';
        ctx.fillText(yearSet, lx + 10, ly + 20);

        // Card number (right side of red bar)
        if (info.cardNumber) {
          ctx.font = 'bold 12px Arial, sans-serif';
          const cnText = '#' + info.cardNumber;
          const cnW = ctx.measureText(cnText).width;
          ctx.fillText(cnText, lx + lw - cnW - 10, ly + 20);
        }

        // Card name (black on white)
        ctx.fillStyle = '#000';
        ctx.font = 'bold 14px Arial, sans-serif';
        const cardName = (info.name || 'CARD NAME').toUpperCase();
        ctx.fillText(cardName, lx + 10, ly + 46);

        // Grade text (right side)
        const gradeLabel = info.grader === 'PSA' ? getGradeText(info.grade) : info.grade;
        ctx.font = 'bold 13px Arial, sans-serif';
        ctx.fillStyle = '#000';
        const gradeText = gradeLabel;
        const gtW = ctx.measureText(gradeText).width;
        ctx.fillText(gradeText, lx + lw - gtW - 10, ly + 46);

        // Grade number (large, right)
        ctx.font = 'bold 28px Arial, sans-serif';
        ctx.fillStyle = '#000';
        const gradeNum = String(info.grade);
        const gnW = ctx.measureText(gradeNum).width;
        ctx.fillText(gradeNum, lx + lw - gnW - 10, ly + 78);

        // PSA logo area + cert number (bottom left of label)
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(lx + 8, ly + 58, 40, 22);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial, sans-serif';
        ctx.fillText(info.grader || 'PSA', lx + 12, ly + 74);

        // Cert number
        ctx.fillStyle = '#333';
        ctx.font = '11px Arial, sans-serif';
        ctx.fillText(info.cert || '', lx + 56, ly + 76);

        // ── CARD ART ───────────────────────────────
        ctx.drawImage(img, padding, labelH + padding * 2, img.width, img.height);

        // Resize to max 800px wide to keep file size under 500KB
        let finalCanvas = canvas;
        if (canvas.width > 800) {
          const scale = 800 / canvas.width;
          finalCanvas = document.createElement('canvas');
          finalCanvas.width = 800;
          finalCanvas.height = Math.round(canvas.height * scale);
          finalCanvas.getContext('2d').drawImage(canvas, 0, 0, finalCanvas.width, finalCanvas.height);
        }
        resolve(finalCanvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => resolve(cardDataUrl); // Fallback to raw art
      img.src = cardDataUrl;
    });
  }

  function getGradeText(grade) {
    const g = parseFloat(grade);
    if (g === 10) return 'GEM MT';
    if (g === 9) return 'MINT';
    if (g === 8.5) return 'NM-MT+';
    if (g === 8) return 'NM-MT';
    if (g === 7.5) return 'NR MT+';
    if (g === 7) return 'NR MT';
    if (g === 6.5) return 'EX-MT+';
    if (g === 6) return 'EX-MT';
    if (g === 5.5) return 'EX+';
    if (g === 5) return 'EX';
    if (g === 4) return 'VG-EX';
    if (g === 3) return 'VG';
    if (g === 2) return 'GOOD';
    if (g === 1.5) return 'FR';
    if (g === 1) return 'PR';
    return '';
  }

  // ── SAVE / UPDATE / ARCHIVE / DELETE ──────────────────────────
  async function saveSlab() {
    const slab = {
      id: $('#fCert').value,
      name: $('#fName').value,
      set: $('#fSet').value,
      year: parseInt($('#fYear').value),
      cardNumber: $('#fCardNum').value,
      grader: $('#fGrader').value,
      grade: parseFloat($('#fGrade').value),
      price: parseInt($('#fPrice').value) || 0,
      hiddenPrice: parseInt($('#fHidden').value) || 0,
      quantity: parseInt($('#fQty').value) || 1,
      sold: 0,
      archived: false,
      dateAdded: new Date().toISOString().split('T')[0],
      image: ''
    };
    slab.image = slab.id + '-front.jpg';

    if (!slab.id || !slab.name) {
      toast('Name and Cert # are required');
      return;
    }

    toast('Publishing...');

    try {
      // Upload image — compress to stay under Netlify's 6MB payload limit
      if (uploadedImageData) {
        // Always compress to JPEG, max 800px wide
        const compressedBase64 = await compressImage(uploadedImageData, 800, 0.82);
        await api('upload-image', { imageBase64: compressedBase64, filename: slab.image });
      }

      // Add slab to inventory and save
      inventory.push(slab);
      const result = await api('save-inventory', { inventory, sha: inventorySha });
      inventorySha = result.sha;

      updateCounts();
      renderGrid();
      closePanel();
      toast('Slab published — site updates in ~30 sec');
    } catch (e) {
      // Remove the slab we just added since commit failed
      inventory = inventory.filter(x => x.id !== slab.id);
      toast('Publish failed: ' + e.message);
      console.error(e);
    }
  }

  async function updateSlab() {
    const s = inventory.find(x => x.id === editingId);
    if (!s) return;
    s.name = $('#fName').value;
    s.set = $('#fSet').value;
    s.year = parseInt($('#fYear').value);
    s.cardNumber = $('#fCardNum').value;
    s.grader = $('#fGrader').value;
    s.grade = parseFloat($('#fGrade').value);
    s.price = parseInt($('#fPrice').value) || 0;
    s.hiddenPrice = parseInt($('#fHidden').value) || 0;
    s.quantity = parseInt($('#fQty').value) || 1;
    s.sold = parseInt($('#fSold').value) || 0;

    toast('Saving...');
    try {
      const result = await api('save-inventory', { inventory, sha: inventorySha });
      inventorySha = result.sha;
      updateCounts();
      renderGrid();
      closePanel();
      toast('Slab updated — site updates in ~30 sec');
    } catch (e) {
      toast('Save failed: ' + e.message);
    }
  }

  async function markSold() {
    const s = inventory.find(x => x.id === editingId);
    if (!s) return;
    const qty = s.quantity || 1;
    const currentSold = typeof s.sold === 'number' ? s.sold : 0;
    if (currentSold >= qty) { toast('Already fully sold'); return; }
    s.sold = currentSold + 1;
    s.soldDate = new Date().toISOString().split('T')[0];
    toast('Saving...');
    try {
      const result = await api('save-inventory', { inventory, sha: inventorySha });
      inventorySha = result.sha;
      updateCounts(); renderGrid(); closePanel();
      toast(getAvailable(s) > 0 ? 'Marked 1 sold — ' + getAvailable(s) + ' remaining' : 'Sold out');
    } catch (e) {
      s.sold = currentSold;
      toast('Failed: ' + e.message);
    }
  }

  async function archiveSlab() {
    const s = inventory.find(x => x.id === editingId);
    if (!s) return;
    s.archived = true;
    toast('Archiving...');
    try {
      const result = await api('save-inventory', { inventory, sha: inventorySha });
      inventorySha = result.sha;
      updateCounts(); renderGrid(); closePanel();
      toast('Slab archived');
    } catch (e) { s.archived = false; toast('Failed: ' + e.message); }
  }

  async function unarchiveSlab() {
    const s = inventory.find(x => x.id === editingId);
    if (!s) return;
    s.archived = false;
    toast('Reactivating...');
    try {
      const result = await api('save-inventory', { inventory, sha: inventorySha });
      inventorySha = result.sha;
      updateCounts(); renderGrid(); closePanel();
      toast('Slab reactivated');
    } catch (e) { s.archived = true; toast('Failed: ' + e.message); }
  }

  async function deleteSlab() {
    if (!confirm('Permanently delete this slab?')) return;
    const removed = inventory.find(x => x.id === editingId);
    inventory = inventory.filter(x => x.id !== editingId);
    toast('Deleting...');
    try {
      const result = await api('save-inventory', { inventory, sha: inventorySha });
      inventorySha = result.sha;
      updateCounts(); renderGrid(); closePanel();
      toast('Slab deleted');
    } catch (e) { inventory.push(removed); toast('Failed: ' + e.message); }
  }

  // ── INIT ──────────────────────────────────────────────────────
  const savedPass = sessionStorage.getItem('tcg_admin');
  if (savedPass) {
    adminPassword = savedPass;
    showDashboard();
  }
  </script>

</body>
</html>
